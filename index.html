<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">
    <title>Music Player</title>
</head>
<body>
    <div class="player">
        <div class="wrapper">
            <div class="details">
                <div class="now-playing">Playing x of y</div>
                <div class="track-art"></div>
                <div class="track-name">Track Name</div>
                <div class="track-artist">Track Artist</div>
            </div>

            <div class="slider_container">
                <div class="current-time">00:00</div>
                <input type="range" min="1" max="100" value="0" class="seek_slider" onchange="seekTo()">
                <div class="total-duration">00:00</div>
            </div>

            <div class="slider_container">
                <i class="ri-volume-down-line"></i>
                <input type="range" min="1" max="100" value="99" class="volume_slider" onchange="setVolume()">
                <i class="ri-volume-up-line"></i>
            </div>
<!-- buttons -->
            <div class="buttons">
                <div class="shuffle-track" onclick="shuffleTrack()">
                    <i class="ri-shuffle-line ri-2x" title="shuffle"></i>
                </div>
                <div class="prev-track" onclick="prevTrack()">
                    <i class="ri-skip-back-line ri-2x"></i>
                </div>
                <div class="playpause-track" onclick="playpauseTrack()">
                    <i class="ri-play-circle-line ri-5x" title="playpause"></i>
                </div>
                <div class="next-track" onclick="nextTrack()">
                    <i class="ri-skip-forward-line ri-2x"></i>
                </div>
                <div class="repeat-track" onclick="repeatTrack()">
                    <i class="ri-loop-left-fill ri-2x"></i>
                </div>
            </div>

            <div id="wave">
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
                <span class="stroke"></span>
            </div>
        </div>
    </div>

    
</body>
</html>
